name: Build

on: [push]

jobs:
  build-snowflake-cli:
    name: Build snowflake-cli cask
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install and check cask
        run: |
          brew tap snowflakedb/snowflake-cli "$(pwd)"
          brew install --debug --cask snowflakedb/snowflake-cli/snowflake-cli
          export PATH="/Applications/SnowflakeCLI.app/Contents/MacOS:$PATH"
          which snow
          snow --version

  build-snowcli:
    name: Build snowcli cask
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install and check cask
        run: |
          brew tap snowflakedb/snowflake-cli "$(pwd)"
          brew install --debug --cask snowflakedb/snowflake-cli/snowcli
          export PATH="/Applications/SnowCLI.app/Contents/MacOS:$PATH"
          which snow
          snow --version


